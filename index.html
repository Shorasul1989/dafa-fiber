<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAFA FIBER Pro - Zakup & Logistika</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #1F2937; }
        .container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        .sidebar { background: white; border-radius: 12px; padding: 20px; height: fit-content; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .sidebar h3 { margin-bottom: 15px; color: #667eea; font-size: 14px; text-transform: uppercase; font-weight: 600; }
        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: #6B7280; text-transform: uppercase; }
        .filter-group select { width: 100%; padding: 8px 12px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 13px; color: #1F2937; background: white; cursor: pointer; }
        .filter-group select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        .header { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #1F2937; font-size: 28px; }
        .header-actions { display: flex; gap: 10px; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-secondary { background: #E5E7EB; color: #1F2937; }
        .btn-secondary:hover { background: #D1D5DB; }
        .tabs { display: flex; gap: 0; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .tab { flex: 1; padding: 15px 20px; background: white; border: none; cursor: pointer; font-weight: 600; font-size: 13px; border-bottom: 3px solid transparent; color: #6B7280; transition: all 0.2s; text-transform: uppercase; }
        .tab.active { background: white; border-bottom-color: #667eea; color: #667eea; }
        .tab:hover { background: #F9FAFB; }
        .tab-content { display: none; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .tab-content.active { display: block; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: white; border: 1px solid #E5E7EB; border-top: 4px solid #667eea; border-radius: 8px; padding: 15px; transition: all 0.2s; }
        .card:hover { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); }
        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
        .card-title { font-weight: 600; color: #1F2937; font-size: 14px; }
        .card-actions { display: flex; gap: 8px; }
        .card-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px 8px; color: #6B7280; }
        .card-btn:hover { color: #1F2937; }
        .card-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid #F3F4F6; }
        .card-row:last-child { border-bottom: none; }
        .label { color: #6B7280; font-weight: 500; }
        .value { color: #1F2937; font-weight: 600; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-approved { background: #D1FAE5; color: #065F46; }
        .status-shipped { background: #DBEAFE; color: #0C4A6E; }
        .status-delivered { background: #E9D5FF; color: #6B21A8; }
        .search-box { background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .search-box input { width: 100%; padding: 10px 15px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 14px; }
        .search-box input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .empty-state { text-align: center; padding: 40px 20px; color: #6B7280; }
        .empty-state-icon { font-size: 48px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #F9FAFB; padding: 12px; text-align: left; font-weight: 600; font-size: 12px; color: #6B7280; text-transform: uppercase; border-bottom: 2px solid #E5E7EB; }
        td { padding: 12px; border-bottom: 1px solid #E5E7EB; font-size: 13px; }
        tr:hover { background: #F9FAFB; }
        .chart-container { position: relative; height: 400px; }
        .loading { text-align: center; padding: 40px; color: #6B7280; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #E5E7EB; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Filtrlar</h3>
            <div class="filter-group">
                <label>Status</label>
                <select id="statusFilter">
                    <option value="">Barchasi</option>
                    <option value="Pending">Kutilmoqda</option>
                    <option value="Approved">Tasdiqlandi</option>
                    <option value="Shipped">Jo'natildi</option>
                    <option value="Delivered">Yetkazildi</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Logistika</label>
                <select id="logisticsFilter">
                    <option value="">Barchasi</option>
                    <option value="Avia">Avia (Hava yo'li)</option>
                    <option value="Train">Poyezd (Temir yo'li)</option>
                    <option value="Container">Konteyner (Dengiz)</option>
                    <option value="Courier">Kuryer</option>
                    <option value="Self">O'zi Olib</option>
                </select>
            </div>
        </div>
        <div class="main-content">
            <div class="header">
                <h1>🚀 DAFA FIBER</h1>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="showAddForm()">+ Yangi Zayavka</button>
                    <button class="btn btn-secondary" onclick="exportData()">📥 Export CSV</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Qidiruv..." onkeyup="applyFilters()">
            </div>
            <div class="tabs">
                <button class="tab active" onclick="switchTab('zayavkalar')">📋 Zayavkalar</button>
                <button class="tab" onclick="switchTab('tahlil')">📊 Tahlil</button>
                <button class="tab" onclick="switchTab('klient')">👥 Klient</button>
            </div>
            <div id="zayavkalar" class="tab-content active">
                <div id="cardsContainer" class="cards-grid">
                    <div class="loading"><div class="spinner"></div> Yuklanmoqda...</div>
                </div>
            </div>
            <div id="tahlil" class="tab-content">
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
            <div id="klient" class="tab-content">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Nomi</th>
                            <th>Miqdori</th>
                            <th>Narx</th>
                            <th>Jami</th>
                            <th>Valyuta</th>
                            <th>Status</th>
                            <th>Logistika</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="7" class="loading"><div class="spinner"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:12px; width:90%; max-width:500px;">
            <h2 style="margin-bottom:20px; color:#1F2937;">Yangi Zayavka Qo'shish</h2>
            <form id="itemForm" style="display:grid; gap:15px;">
                <input type="text" id="formName" placeholder="Mahsulot Nomi" required>
                <input type="number" id="formQty" placeholder="Miqdori (ta)" required>
                <input type="number" id="formPrice" placeholder="Narx" required>
                <select id="formCurrency" required>
                    <option value="CNY">¥ CNY</option>
                    <option value="USD">$ USD</option>
                    <option value="EUR">€ EUR</option>
                    <option value="UZS">so'm UZS</option>
                    <option value="RUB">₽ RUB</option>
                </select>
                <select id="formSupplier" required>
                    <option value="">Supplier Tanlang</option>
                    <option value="Sinopharm">Sinopharm</option>
                    <option value="VISIOTT">VISIOTT</option>
                    <option value="Hyosung">Hyosung</option>
                    <option value="Other">Other</option>
                </select>
                <select id="formStatus" required>
                    <option value="Pending">Kutilmoqda</option>
                    <option value="Approved">Tasdiqlandi</option>
                    <option value="Shipped">Jo'natildi</option>
                    <option value="Delivered">Yetkazildi</option>
                </select>
                <select id="formLogistics" required>
                    <option value="Avia">✈️ Avia (Hava yo'li)</option>
                    <option value="Train">🚂 Poyezd (Temir yo'li)</option>
                    <option value="Container">📦 Konteyner (Dengiz)</option>
                    <option value="Courier">🚚 Kuryer</option>
                    <option value="Self">🚗 O'zi Olib</option>
                </select>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Bekor</button>
                    <button type="submit" class="btn btn-primary">Qo'shish</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://xkolfexhjirdaxhdzph.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhrb2xmZXhoamlpcmRheGhkenBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Nzc4MzAsImV4cCI6MjEwMjU1MzgzMH0._BEhD8yXogXaORU39O96yUfdKvGHTD0dMn6UFmbYrUU';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allData = [], filteredData = [], statusChart = null, editingId = null;
        async function init() { await loadData(); setupEventListeners(); }
        async function loadData() {
            try {
                const { data, error } = await supabase.from('items').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allData = data || [];
                filteredData = [...allData];
                renderCards(); renderTable(); updateChart();
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('cardsContainer').innerHTML = `<p class="empty-state">❌ Data yuklashda xato</p>`;
            }
        }
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            if (!filteredData.length) { container.innerHTML = '<p class="empty-state"><div class="empty-state-icon">📭</div>Zayavka yo\'q</p>'; return; }
            container.innerHTML = filteredData.map(item => `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">${item.name}</div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="editItem(${item.id})">✏️</button>
                            <button class="card-btn" onclick="deleteItem(${item.id})">🗑️</button>
                        </div>
                    </div>
                    <div class="card-row"><span class="label">Miqdori:</span><span class="value">${item.qty} ta</span></div>
                    <div class="card-row"><span class="label">Narx:</span><span class="value">${getCurrencySymbol(item.currency)}${item.price}</span></div>
                    <div class="card-row"><span class="label">Jami:</span><span class="value">${getCurrencySymbol(item.currency)}${item.total || item.qty * item.price}</span></div>
                    <div class="card-row"><span class="label">Status:</span><span class="status-badge status-${item.status.toLowerCase()}">${item.status}</span></div>
                    <div class="card-row"><span class="label">Logistika:</span><span class="value">${getLogisticsIcon(item.logistics)} ${item.logistics}</span></div>
                </div>
            `).join('');
        }
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (!filteredData.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Zayavka yo\'q</td></tr>'; return; }
            tbody.innerHTML = filteredData.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.qty} ta</td>
                    <td>${getCurrencySymbol(item.currency)}${item.price}</td>
                    <td>${getCurrencySymbol(item.currency)}${item.total || item.qty * item.price}</td>
                    <td>${item.currency}</td>
                    <td><span class="status-badge status-${item.status.toLowerCase()}">${item.status}</span></td>
                    <td>${getLogisticsIcon(item.logistics)} ${item.logistics}</td>
                </tr>
            `).join('');
        }
        function updateChart() {
            const ctx = document.getElementById('statusChart');
            if (!ctx) return;
            const counts = { 'Pending': filteredData.filter(i => i.status === 'Pending').length, 'Approved': filteredData.filter(i => i.status === 'Approved').length, 'Shipped': filteredData.filter(i => i.status === 'Shipped').length, 'Delivered': filteredData.filter(i => i.status === 'Delivered').length };
            if (statusChart) statusChart.destroy();
            statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Kutilmoqda', 'Tasdiqlandi', 'Jo\'natildi', 'Yetkazildi'], datasets: [{ data: Object.values(counts), backgroundColor: ['#FBBF24', '#10B981', '#3B82F6', '#8B5CF6'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newItem = {
                name: document.getElementById('formName').value,
                qty: parseInt(document.getElementById('formQty').value),
                price: parseInt(document.getElementById('formPrice').value),
                currency: document.getElementById('formCurrency').value,
                supplier: document.getElementById('formSupplier').value,
                status: document.getElementById('formStatus').value,
                logistics: document.getElementById('formLogistics').value,
                total: parseInt(document.getElementById('formQty').value) * parseInt(document.getElementById('formPrice').value)
            };
            try {
                if (editingId) {
                    await supabase.from('items').update(newItem).eq('id', editingId);
                    editingId = null;
                } else {
                    await supabase.from('items').insert([newItem]);
                }
                closeModal();
                await loadData();
            } catch (err) {
                alert('Xato: ' + err.message);
            }
        });
        async function deleteItem(id) {
            if (confirm('O\'chirilsinmi?')) {
                try {
                    await supabase.from('items').delete().eq('id', id);
                    await loadData();
                } catch (err) {
                    alert('Xato: ' + err.message);
                }
            }
        }
        function editItem(id) {
            const item = allData.find(i => i.id === id);
            if (item) {
                document.getElementById('formName').value = item.name;
                document.getElementById('formQty').value = item.qty;
                document.getElementById('formPrice').value = item.price;
                document.getElementById('formCurrency').value = item.currency;
                document.getElementById('formSupplier').value = item.supplier;
                document.getElementById('formStatus').value = item.status;
                document.getElementById('formLogistics').value = item.logistics;
                editingId = id;
                showAddForm();
            }
        }
        function applyFilters() {
            const status = document.getElementById('statusFilter').value;
            const logistics = document.getElementById('logisticsFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            filteredData = allData.filter(item =>
                (!status || item.status === status) &&
                (!logistics || item.logistics === logistics) &&
                (item.name.toLowerCase().includes(search) || item.supplier.toLowerCase().includes(search))
            );
            renderCards(); renderTable(); updateChart();
        }
        document.getElementById('statusFilter').addEventListener('change', applyFilters);
        document.getElementById('logisticsFilter').addEventListener('change', applyFilters);
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            if (tab === 'tahlil') setTimeout(() => updateChart(), 100);
        }
        function showAddForm() {
            editingId = null;
            document.getElementById('itemForm').reset();
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        window.onclick = (e) => {
            if (e.target.id === 'modal') closeModal();
        };
        function exportData() {
            let csv = 'Name,Qty,Price,Currency,Total,Status,Logistics\n';
            filteredData.forEach(item => {
                csv += `"${item.name}",${item.qty},${item.price},${item.currency},${item.total},${item.status},${item.logistics}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dafa-fiber.csv';
            a.click();
        }
        function getCurrencySymbol(curr) {
            const symbols = { CNY: '¥', USD: '$', EUR: '€', UZS: 'so\'m', RUB: '₽' };
            return symbols[curr] || curr;
        }
        function getLogisticsIcon(log) {
            const icons = { Avia: '✈️', Train: '🚂', Container: '📦', Courier: '🚚', Self: '🚗' };
            return icons[log] || '🚚';
        }
        function setupEventListeners() {}
        init();
    </script>
</body>
</html>
